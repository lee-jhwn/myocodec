[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-emg-codec"
version = "1.0.0"
description = "MyoCodec: a streaming neural codec for surface EMG"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "scipy>=1.11",
    "h5py>=3.9",
    "PyYAML>=6.0",
    "huggingface_hub>=0.34",
]

[project.optional-dependencies]
train = ["muon-optimizer>=0.1", "wandb>=0.16"]
data = ["wfdb>=4.1", "pandas>=2.0", "tables>=3.9"]

[tool.setuptools.packages.find]
include = ["streaming_emg_codec*"]
